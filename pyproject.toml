[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-observability"
version = "0.1.0"
description = "Production-grade RAG system with full AI observability (tracing, defect detection, evaluation)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "rag-observability maintainers" }]

# Deps grow per phase to keep the install surface honest.
dependencies = [
    # Phase 1: config + logging + API surface
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Phase 2: ingestion pipeline
    "langchain-text-splitters>=0.2",
    "pypdf>=4.0",
    "qdrant-client>=1.10",
    "openai>=1.40",
    "tiktoken>=0.7",
    # NumPy 2.x stubs use Python 3.12 type syntax, while this project and
    # strict mypy configuration intentionally retain Python 3.11 support.
    "numpy>=1.26,<2",
    "tenacity>=8.5",
    "opentelemetry-api>=1.25",
    # Phase 3: hybrid retrieval (BM25 lives in-process; reranker is opt-in)
    "rank-bm25>=0.2.2",
    # Phase 4: observability layer (Phoenix tracing + defect detection)
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    # Phase 5: LLM generation + /query endpoint
    "anthropic>=0.40",
    # Phase 6: persistence (Postgres + async ORM + Alembic)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    # Phase 10: production hardening (rate limiting)
    "slowapi>=0.1.9",
    "PyJWT[crypto]>=2.7,<3",
    "redis>=5.0,<6",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
    "aiosqlite>=0.20",
    "cryptography>=41",
]
dashboard = [
    "streamlit>=1.36",
    "pandas>=2.2",
]
# Heavy: pulls torch + ~80MB model download on first use. Install via
# `pip install -e ".[reranker]"` only when you want cross-encoder reranking.
reranker = [
    "sentence-transformers>=3.0",
]
# Heavy: pulls langchain + datasets + a chain of transitive deps.
# `pip install -e ".[eval]"` to enable RAGAS-based evaluation.
# RAGAS 0.4 imports ChatVertexAI from langchain_community at module load,
# but that submodule moved out in current langchain-community. Pin to 0.2.x
# until RAGAS publishes a compatible fix.
eval = [
    "ragas>=0.2,<0.3",
    "datasets>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]
exclude = ["tests*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length is enforced by formatter

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI handlers idiomatically use Query()/Depends() as defaults.
"src/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Strict typing scope grows per phase as code lands.
files = [
    "src/config",
    "src/api",
    "src/ingestion",
    "src/observability",
    "src/retrieval",
    "src/evaluation",
    "src/generation",
    "src/pipeline",
    "src/storage",
    "cli",
]
# Alembic env.py is dynamically loaded by alembic itself with non-standard
# imports — exclude it from strict mypy.
exclude = ["src/storage/migrations/"]

[[tool.mypy.overrides]]
module = [
    "structlog.*",
    "tiktoken.*",
    "langchain_text_splitters.*",
    "pypdf.*",
    "qdrant_client.*",
    "rank_bm25.*",
    "sentence_transformers.*",
    "ragas.*",
    "datasets.*",
    "langchain_community.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL, Redis, Qdrant, and MinIO services",
]
