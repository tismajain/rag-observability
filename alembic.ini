# Alembic configuration. The actual env.py lives in src/storage/migrations/.
# The DB URL is read from src.config.settings inside env.py — do NOT put it
# here. Keeping it out of this file prevents secrets from sitting in source
# control.

[alembic]
script_location = src/storage/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
